name: color_blendr
description: "Color Palette Generator"
publish_to: 'none'

# <version name>+<version code>. The version code must increase for every Play upload
# (1.1.0+6 is the last version published before the 2.0 rewrite).
version: 2.0.1+14

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  # State management
  flutter_riverpod: ^3.5.0

  # Color Blendr API (palettes are generated and named on the device)
  http: ^1.2.0

  # Google sign-in (ID token exchanged with the Color Blendr API for a session)
  google_sign_in: ^7.2.0

  # Session token storage (Android Keystore)
  flutter_secure_storage: ^11.2.0

  # Local settings (e.g. colors per palette)
  shared_preferences: ^2.5.6

  # Pro: share exported palette files, and pick photos to pull palettes from
  share_plus: ^13.3.1
  image_picker: ^1.2.4

  # Pro purchases: Google Play Billing through RevenueCat (the API decides Pro)
  purchases_flutter: ^11.0.3
  # Opens Google Play's "Manage subscription" page
  url_launcher: ^6.3.3
  google_mobile_ads: ^9.2.0
  # AdMob mediation: Unity Ads and Liftoff Monetize bid against Google for
  # each ad (set up in the AdMob console). Pinned to versions whose
  # google_mobile_ads range includes ours.
  gma_mediation_unity: 1.12.0
  gma_mediation_liftoffmonetize: 1.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the test/ suite on a device: flutter test integration_test -d <device>
  # (needed on this PC because Smart App Control blocks the desktop flutter_tester.exe)
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Regenerate icons with: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# App icon (Android only; the app ships on Google Play)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/launcher_icon.png"

flutter:
  uses-material-design: true
